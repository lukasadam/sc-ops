repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + import sorting)
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (format)
        entry: ruff format
        language: system
        types_or: [python, pyi]
