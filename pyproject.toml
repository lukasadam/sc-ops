[project]
name = "sc-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.11.4",
    "cellmapper>=0.2.5",
    "decoupler>=2.1.4",
    "delnx>=0.2.3",
    "dynaconf>=3.2.12",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pybiomart>=0.2.0",
    "pyright>=1.1.408",
    "scanpy>=1.11.5",
    "scikit-learn>=1.8.0",
    "scipy==1.15.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pyright>=1.1.408",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
